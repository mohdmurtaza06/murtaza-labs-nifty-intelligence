name: Project safety checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas pandas-market-calendars

      - name: Run fail-closed regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q backend src notebooks tests
